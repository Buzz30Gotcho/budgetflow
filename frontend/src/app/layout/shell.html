<div class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <span class="font-bold text-indigo-600">💸 BudgetFlow</span>
        <nav class="flex gap-4 text-sm">
          <a routerLink="/dashboard" routerLinkActive="text-indigo-600 font-semibold"
             class="text-slate-600 hover:text-indigo-600">Tableau de bord</a>
          <a routerLink="/transactions" routerLinkActive="text-indigo-600 font-semibold"
             class="text-slate-600 hover:text-indigo-600">Transactions</a>
          <a routerLink="/categories" routerLinkActive="text-indigo-600 font-semibold"
             class="text-slate-600 hover:text-indigo-600">Catégories</a>
          <a routerLink="/budgets" routerLinkActive="text-indigo-600 font-semibold"
             class="text-slate-600 hover:text-indigo-600">Budgets</a>
        </nav>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-slate-500">Bonjour, {{ firstName() }}</span>
        <button (click)="logout()" class="text-slate-500 hover:text-red-600">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>
