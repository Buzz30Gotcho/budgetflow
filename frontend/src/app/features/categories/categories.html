<h1 class="text-xl font-bold text-slate-800 mb-4">Catégories</h1>

<div class="bg-white rounded-xl border border-slate-200 p-4 mb-6">
  <form (ngSubmit)="add()" class="flex flex-wrap items-end gap-3">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Nom</label>
      <input type="text" name="name" [(ngModel)]="name" placeholder="Courses, Loyer…"
             class="rounded-lg border border-slate-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Couleur</label>
      <input type="color" name="color" [(ngModel)]="color"
             class="h-10 w-16 rounded-lg border border-slate-300" />
    </div>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 font-medium">
      Ajouter
    </button>
  </form>
  @if (error()) {
    <p class="text-sm text-red-600 mt-2">{{ error() }}</p>
  }
</div>

<div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
  @for (cat of categories(); track cat.id) {
    <div class="flex items-center justify-between px-4 py-3">
      @if (editingId() === cat.id) {
        <div class="flex items-center gap-3">
          <input type="color" name="editColor" [(ngModel)]="editColor"
                 class="h-9 w-12 rounded-lg border border-slate-300" />
          <input type="text" name="editName" [(ngModel)]="editName"
                 class="rounded-lg border border-slate-300 px-3 py-1.5" />
        </div>
        <div class="flex items-center gap-3">
          <button (click)="saveEdit(cat.id)" class="text-sm text-indigo-600 font-medium hover:text-indigo-700">Enregistrer</button>
          <button (click)="cancelEdit()" class="text-sm text-slate-400 hover:text-slate-600">Annuler</button>
        </div>
      } @else {
        <div class="flex items-center gap-3">
          <span class="w-4 h-4 rounded-full" [style.background-color]="cat.color"></span>
          <span class="text-slate-800">{{ cat.name }}</span>
        </div>
        <div class="flex items-center gap-4">
          <button (click)="startEdit(cat)" class="text-sm text-slate-400 hover:text-indigo-600">Modifier</button>
          <button (click)="remove(cat.id)" class="text-sm text-slate-400 hover:text-red-600">Supprimer</button>
        </div>
      }
    </div>
  } @empty {
    <p class="px-4 py-6 text-center text-sm text-slate-400">Aucune catégorie pour le moment.</p>
  }
</div>
