spring.application.name=budgetflow

# --- Base de donnees (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budgetflow}
spring.datasource.username=${DB_USERNAME:budgetflow}
spring.datasource.password=${DB_PASSWORD:budgetflow}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Securite / JWT ---
# Cle par defaut (dev uniquement). En prod, surcharger via la variable d'env JWT_SECRET.
application.security.jwt.secret-key=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItYnVkZ2V0Zmxvdy1kZXYtb25seS0xMjM0NTY3ODkw}
# Duree de validite du token : 24h en millisecondes
application.security.jwt.expiration=86400000

# --- Serveur ---
server.port=8080
