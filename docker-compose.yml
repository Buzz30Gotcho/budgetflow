services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: budgetflow
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/budgetflow
      DB_USERNAME: budgetflow
      DB_PASSWORD: budgetflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db-data:
